[workspace]
members = [
    "Common",
    "Drone",
    "GroundControl"
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
# The ground solver needs runtime speed; keep embedded package size settings.
[profile.release.package.GroundControl]
opt-level = 3

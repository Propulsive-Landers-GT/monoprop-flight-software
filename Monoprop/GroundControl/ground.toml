# User-specified provisional model; not a measured thrust calibration or inertia tensor.
# SI units throughout. Mass agrees with monoprop-prototype-software/flight-core/config/monoprop.toml.
mass_kg = 1.05
# Solid-cylinder estimate: height=22.5 in=0.5715 m, radius=3 in=0.0762 m.
# Ixx=Iyy=m*(3*r^2+h^2)/12; Izz=m*r^2/2, cylinder axis along body z.
# These are CENTRAL uniform-cylinder moments, used as an approximate CoM tensor.
# The stated CoM is 7.25 in above the gimbal, whereas a uniform cylinder starting
# there would have its CoM at 11.25 in. Actual mass distribution is nonuniform;
# dimensions and CoM alone do not determine its exact inertia. No parallel-axis
# shift is applied: shifting the uniform cylinder would give moments about a
# non-CoM reference point, not the actual vehicle's CoM inertia.
inertia_kg_m2 = [0.030102762375, 0.030102762375, 0.003048381]
# CoM above the gimbal: 7.25 in * 0.0254 m/in.
lever_arm_m = 0.18415
# Assumed combined thrust of BOTH propellers versus normalized ESC command.
# F=16*(u-0.15)/0.85 N over the running range 0.15<=u<=1.
# The zero-force endpoint at 15% is an idealization; the motors already spin there.
# Firmware still uses command 0 for stopped/disarmed motors.
thrust_curve = [[0.15, 0.0], [1.0, 16.0]]
gimbal_sign = [1.0, 1.0]
hover_height_m = 1.0
# Live operation uses these configured assumptions; no manual validation flag is required.

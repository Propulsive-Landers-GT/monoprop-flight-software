[package]
name = "GroundControl"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["use-std"] }
anyhow = "1.0"
crossbeam-channel = "0.5"
optimization_engine = "0.6.0"
serde_json = "1.0"
toml = "0.8"
rust_lossless = { git = "https://github.com/Propulsive-Landers-GT/guidance.git", rev = "a24ed790671ce951dd5198cac7a0af1fd154d166" }
# Exact wire types used by the adjacent prototype flight computer.
monoprop-common = { path = "../../../monoprop-prototype-software/common" }

[dev-dependencies]
monoprop-teensy41-firmware = { path = "../../../monoprop-prototype-software/teensy41-firmware" }

[lib]
name = "ground_control"

[[bin]]
name = "GroundControl"
path = "src/main.rs"

[package]
name = "imu"
version = "0.1.0"
edition = "2024"
description = "Vehicle-independent IMU sample type and driver trait (no_std)"

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0"
